<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VITAL-SCHOOL | Вхід</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-600 flex items-center justify-center min-h-screen p-4">

    <div id="step-1" class="auth-card bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md text-center">
        <h1 class="text-3xl font-black text-blue-700 mb-6">VITAL-SCHOOL</h1>
        <div class="space-y-4">
            <input type="text" id="userName" placeholder="Ім'я та Прізвище" class="w-full border-2 p-3 rounded-xl outline-none focus:border-blue-400">
            <input type="email" placeholder="Електронна пошта" class="w-full border-2 p-3 rounded-xl outline-none focus:border-blue-400">
            <input type="password" placeholder="Пароль" class="w-full border-2 p-3 rounded-xl outline-none focus:border-blue-400">
            <button onclick="nextStep(2)" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition">ЗАРЕЄСТРУВАТИСЯ</button>
            <div class="flex flex-col gap-2 pt-2">
                <button onclick="nextStep(2)" class="flex items-center justify-center gap-2 border p-2 rounded-xl text-sm font-medium hover:bg-gray-50">
                    <img src="https://www.google.com/favicon.ico" class="w-4"> Увійти через Google
                </button>
            </div>
        </div>
    </div>

    <div id="step-2" class="hidden auth-card bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md text-center">
        <div class="text-5xl mb-4">📧</div>
        <h2 class="text-2xl font-bold text-blue-700 mb-4">Перевірте пошту</h2>
        <p class="text-gray-600 mb-6">Ми надіслали лист для підтвердження. Натисніть на посилання у листі, щоб продовжити.</p>
        <button onclick="nextStep(3)" class="w-full bg-green-500 text-white font-bold py-3 rounded-xl">Я ПІДТВЕРДИВ(ЛА)</button>
    </div>

    <div id="step-3" class="hidden auth-card bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md text-center">
        <div class="text-5xl mb-4">⏳</div>
        <h2 class="text-2xl font-bold text-blue-700 mb-4">Заявка на розгляді</h2>
        <p class="text-gray-600 mb-6">Ваш акаунт очікує на підтвердження вчителем. Доступ буде надано після перевірки даних адміністратором школи.</p>
        <div class="flex items-center justify-center gap-2 text-blue-500 font-bold animate-pulse">
            <span>Статус: Очікування...</span>
        </div>
        <button onclick="goToDashboard()" class="mt-6 w-full bg-blue-600 text-white font-bold py-3 rounded-xl">УВІЙТИ В КЛАС</button>
    </div>

    <script>
        function nextStep(step) {
            document.querySelectorAll('.auth-card').forEach(card => card.classList.add('hidden'));
            document.getElementById('step-' + step).classList.remove('hidden');
        }
        function goToDashboard() {
            const name = document.getElementById('userName').value || "Вчитель";
            localStorage.setItem('schoolUserName', name);
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
