<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>VITAL-SCHOOL | Класна кімната</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-50 font-sans text-gray-800">

    <header class="bg-white border-b p-4 flex justify-between items-center px-8 shadow-sm">
        <div class="text-2xl font-black text-blue-600 uppercase tracking-tight">VITAL-SCHOOL</div>
        <div class="flex items-center gap-4">
            <button onclick="window.print()" class="bg-blue-50 text-blue-600 px-4 py-2 rounded-lg font-bold text-xs hover:bg-blue-100">ЗБЕРЕГТИ ЖУРНАЛ</button>
            <span id="userName" class="font-bold border-l pl-4 text-gray-600">Вчитель</span>
        </div>
    </header>

    <main class="max-w-[1600px] mx-auto p-6 grid grid-cols-12 gap-6">
        
        <aside class="col-span-3 bg-white p-6 rounded-3xl shadow-sm border border-gray-100 h-fit">
            <h3 class="font-black text-gray-400 text-xs mb-4 tracking-widest uppercase">Електронний журнал</h3>
            <div id="journal" class="space-y-4">
                </div>
        </aside>

        <section class="col-span-6 grid grid-cols-3 gap-4" id="classGrid">
            </section>

        <aside class="col-span-3 flex flex-col gap-6">
            <div class="bg-white rounded-3xl shadow-sm border border-gray-100 flex flex-col h-[400px] overflow-hidden">
                <div class="p-4 border-b bg-blue-50 font-bold text-blue-700 text-xs tracking-widest">НОВИНИ ВІД ВЧИТЕЛЯ</div>
                <div id="newsFeed" class="flex-1 p-4 space-y-3 overflow-y-auto">
                    <div class="bg-blue-50 p-3 rounded-2xl text-xs border-l-4 border-blue-500">
                        <b>Вчитель:</b> Вітаю у нашому класі! Починаємо урок.
                    </div>
                </div>
                <div class="p-3 border-t">
                    <input id="newsInput" type="text" placeholder="Написати новину..." class="w-full p-2 bg-gray-50 rounded-xl outline-none text-xs">
                </div>
            </div>
        </aside>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
