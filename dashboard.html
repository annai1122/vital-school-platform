<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VITAL-SCHOOL 3-А — Панель вчителя</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="dashboard-wrapper">
        <!-- БОКОВА ПАНЕЛЬ -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>📋 VITAL-SCHOOL</h2>
                <p class="class-name">3-А Клас</p>
            </div>

            <nav class="sidebar-nav">
                <button class="nav-btn active" onclick="switchTab('students')">👥 Учні</button>
                <button class="nav-btn" onclick="switchTab('journal')">📊 Журнал</button>
                <button class="nav-btn" onclick="switchTab('announcements')">📢 Оголошення</button>
            </nav>

            <div class="sidebar-footer">
                <button class="btn btn-logout" onclick="logout()">🚪 Вихід</button>
            </div>
        </aside>

        <!-- ОСНОВНОЙ КОНТЕНТ -->
        <main class="main-content">
            
            <!-- ТАБ 1: УЧНІ (СІТКА З ФОТО) -->
            <div id="tab-students" class="tab-content active">
                <h1>👥 Клас 3-А (12 учнів)</h1>
                <div class="students-grid" id="students-grid">
                    <!-- Студенти будуть завантажені JS -->
                </div>
            </div>

            <!-- ТАБ 2: ЖУРНАЛ ОЦІНОК -->
            <div id="tab-journal" class="tab-content">
                <div class="journal-header">
                    <h1>📊 Журнал відвідувань та оцінок</h1>
                    <button class="btn btn-download" onclick="downloadJournalScreenshot()">⬇️ Завантажити журнал</button>
                </div>
                <div class="journal-wrapper">
                    <table class="journal-table" id="journal-table">
                        <thead>
                            <tr>
                                <th>№</th>
                                <th>Ім'я учня</th>
                                <th>19.04.2026</th>
                                <th>20.04.2026</th>
                                <th>21.04.2026</th>
                            </tr>
                        </thead>
                        <tbody id="journal-body">
                            <!-- Заповнюється JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- ТАБ 3: ОГОЛОШЕННЯ ВЧИТЕЛЯ -->
            <div id="tab-announcements" class="tab-content">
                <h1>📢 Оголошення вчителя</h1>
                <div class="announcements-section">
                    <div class="message-input-group">
                        <textarea id="announcement-text" placeholder="Напишіть оголошення для класу..." rows="3"></textarea>
                        <button class="btn btn-primary" onclick="sendAnnouncement()">Надіслати оголошення 📤</button>
                    </div>
                    <div class="announcements-list" id="announcements-list">
                        <!-- Оголошення будуть тут -->
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- МОДАЛЬНЕ ВІКНО ДЛЯ ГОЛОСОВОЇ ВІДПОВІДІ -->
    <div id="voice-modal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeVoiceModal()">✕</button>
            <div class="student-avatar-modal">
                <img id="modal-student-photo" src="" alt="">
            </div>
            <h2 id="modal-student-name"></h2>
            <p id="voice-response" class="voice-text">🎤 Прослуховування...</p>
            <div class="voice-wave"></div>
        </div>
    </div>

    <script src="https://html2canvas.herokuapp.com/dist/html2canvas.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
